<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <link rel="stylesheet" href="Management.css">
</head>
<body>
<div id="loginPanel" class="login-box">
  <h2>Admin Login</h2>
  <input type="text" id="username" placeholder="Username"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
  <p id="loginError" style="color:red"></p>
</div>
<div id="app" class="hidden">
  <h1> <u>Student Management System</u></h1>
  <div class="container">
    <div class="top-bar">
      <div>
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="roll" placeholder="Roll No">
        <input type="text" id="course" placeholder="Course">
        <button onclick="addOrUpdateStudent()" id="submitBtn">Add Student</button>
      </div>

      <div>
        <input type="text" id="search" placeholder="Search..." onkeyup="displayStudents()">
        <button onclick="logout()">Logout</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
          <th>Course</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>
</div>
</body>
<script src="Management.js"></script>
</html>
